experiment:
  name: "llm-consortium-v1"
  seed: 42
  output_dir: "data/"
  database: "data/consortium.db"

  variants:
    - v1_baseline
    - v2_leader_reviewers
    - v3_parallel_merge
    - v4_adversarial
    - v5_specialist_panel
    - v6_rotating_leader
    - v7_consensus
    - v8_structured_debate

  tasks:
    - t1_url_shortener
    - t2_chat_app
    - t3_ecommerce
    - t4_notification
    - t5_trading_platform
    - t6_video_streaming
    - t7_autonomous_fleet
    - t8_ml_platform

  repetitions: 5

  defaults:
    designer_model: "gpt-4.1"
    reviewer_model: "gpt-4.1"
    evaluator_model: "sonnet-4.5"

  batch:
    enabled: true
    max_concurrent_batches: 5
    poll_interval_seconds: 60
    fallback_to_realtime: true

  limits:
    max_tokens_per_run: 500000
    max_cost_per_run_usd: 2.00
    max_total_cost_usd: 500.00
    max_retries: 3
    retry_backoff_base: 2.0
    timeout_seconds: 300
