experiment:
  name: "llm-consortium-v1"
  seed: 42
  output_dir: "data/"
  database: "data/consortium.db"

  # Parent variants (v2, v3) serve as inheritance templates only;
  # their sub-variants (v2a-c, v3a-c) are the actual experiment conditions.
  variants:
    - v1_baseline
    - v1a_single_shot
    - v2a_same_model
    - v2b_cross_model
    - v2c_multi_model
    - v3a_naive_merge
    - v3b_rubric_merge
    - v3c_dialectical_merge
    - v4_adversarial
    - v5_specialist_panel
    - v6_rotating_leader
    - v7_consensus
    - v8_structured_debate

  tasks:
    - t1_url_shortener
    - t2_rate_limiter
    - t3_notification_system
    - t4_task_queue
    - t5_saas_billing
    - t6_video_streaming
    - t7_rbac_abac
    - t8_ml_platform

  repetitions: 5

  defaults:
    designer_model: "gpt-4.1"
    reviewer_model: "gpt-4.1"
    evaluator_model: "sonnet-4.5"

  batch:
    enabled: true
    max_concurrent_batches: 5
    poll_interval_seconds: 60
    fallback_to_realtime: true

  limits:
    max_tokens_per_run: 1000000
    max_cost_per_run_usd: 4.00
    max_total_cost_usd: 500.00
    max_retries: 3
    retry_backoff_base: 2.0
    timeout_seconds: 300
    max_concurrent_runs: 500
