model:
  id: "do-gpt52"
  provider: "do_inference"
  api_model: "openai-gpt-5.2"

  # GPT-5-tier list pricing estimate (per 1M tokens); refine if exact gpt-5.2
  # rates differ. gpt-5.2 is a reasoning model (separate reasoning tokens); the
  # OpenAI-compatible `content` field carries the final answer used for scoring.
  pricing:
    input: 1.25
    output: 10.00
    batch_discount: 0.0
    cached_input: 0.125

  parameters:
    temperature: 0.0
    max_tokens: 20000   # headroom for reasoning tokens + the final answer
    top_p: 1.0

  context_window: 400000
  supports_batch: false
  supports_caching: false

  rate_limits:
    requests_per_minute: 240
    tokens_per_minute: 2000000
