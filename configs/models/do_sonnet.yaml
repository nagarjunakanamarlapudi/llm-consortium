model:
  id: "do-sonnet"
  provider: "do_inference"
  api_model: "anthropic-claude-4.6-sonnet"

  # Published Claude Sonnet list pricing (per 1M tokens) so cost-effectiveness
  # reflects real-world API cost, not DO's resale price.
  pricing:
    input: 3.00
    output: 15.00
    batch_discount: 0.0
    cached_input: 0.30

  parameters:
    temperature: 0.0   # greedy for reproducible single-sample pass@1 baselines
    max_tokens: 16384
    top_p: 1.0

  context_window: 200000
  supports_batch: false
  supports_caching: false

  rate_limits:
    requests_per_minute: 240
    tokens_per_minute: 400000
