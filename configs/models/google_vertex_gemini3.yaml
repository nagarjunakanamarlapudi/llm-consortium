model:
  id: "vertex-gemini-2.5-pro"
  provider: "google_vertex"
  api_model: "gemini-2.5-pro"

  pricing:
    input: 1.25
    output: 10.00
    batch_discount: 0.00
    cached_input: 0.315

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 1000000
  supports_batch: true
  supports_caching: true

  batching:
    enabled: true
    window_ms: 200000      # 200s window — collect requests for batch submission
    max_batch_size: 100    # batch prediction supports large batches

  vertex_batch:
    enabled: true
    gcs_bucket: "consortium-batch-staging-naga"
    poll_interval_s: 30
    poll_timeout_s: 18000

  rate_limits:
    # Vertex batch prediction: rate limiter acquires per-request in batch,
    # so RPM must be >= max_batch_size to avoid blocking batch handler.
    requests_per_minute: 5000
    tokens_per_minute: 1000000