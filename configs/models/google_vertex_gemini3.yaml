model:
  id: "vertex-gemini-2.5-pro"
  provider: "google_vertex"
  api_model: "gemini-2.5-pro"

  pricing:
    input: 1.25
    output: 10.00
    batch_discount: 0.00
    cached_input: 0.315

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 1000000
  supports_batch: false
  supports_caching: true

  batching:
    enabled: true
    window_ms: 20000       # 20s window — serialize requests for low RPM
    max_batch_size: 1      # one at a time to stay within RPM=5 quota

  rate_limits:
    # Ultra-conservative: SDK has internal retry that multiplies quota usage
    # RPM=1 ensures even with SDK's ~3x internal retry, we stay under quota
    requests_per_minute: 2
    tokens_per_minute: 1000000