model:
  id: "gpt-oss-120b"
  provider: "ollama"
  api_model: "gpt-oss-120b-ctx20k:latest"

  ollama:
    host: "${OLLAMA_HOST:-http://nagarjunas-Mac-Studio.local:11434}"
    concurrency: 2
    keep_alive: "90m"

  pricing:
    input: 0.00
    output: 0.00
    batch_discount: 0.00
    cached_input: 0.00

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 128000
  supports_batch: true
  supports_caching: false

  batching:
    enabled: true
    window_ms: 120000
    max_batch_size: 50

  rate_limits:
    requests_per_minute: 10
    tokens_per_minute: 500000


# OLLAMA_NUM_PARALLEL=50 ollama serve