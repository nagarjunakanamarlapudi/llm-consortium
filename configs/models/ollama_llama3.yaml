model:
  id: "llama3.2"
  provider: "ollama"
  api_model: "llama3.2:latest"

  ollama:
    host: "${OLLAMA_HOST:-http://nagarjunas-Mac-Studio.local:11434}"
    concurrency: 2
    keep_alive: "30m"

  pricing:
    input: 0.00
    output: 0.00
    batch_discount: 0.00
    cached_input: 0.00

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 128000
  supports_batch: true
  supports_caching: false

  batching:
    enabled: true
    window_ms: 60000
    max_batch_size: 20

  rate_limits:
    requests_per_minute: 10
    tokens_per_minute: 500000
