model:
  id: "gpt-4o"
  provider: "openai"
  api_model: "gpt-4o-2024-11-20"

  pricing:
    input: 2.50
    output: 10.00
    batch_discount: 0.50
    cached_input: 1.25

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 128000
  supports_batch: true
  supports_caching: true

  rate_limits:
    requests_per_minute: 500
    tokens_per_minute: 2000000
