model:
  id: "vertex-gpt-oss-120b"
  provider: "google_vertex_openai"
  api_model: "openai/gpt-oss-120b-maas"

  pricing:
    input: 0.09
    output: 0.36
    batch_discount: 0.50
    cached_input: 0.00

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 128000
  supports_batch: true
  supports_caching: false

  batching:
    enabled: true
    window_ms: 200000
    max_batch_size: 150

  rate_limits:
    requests_per_minute: 1000
    tokens_per_minute: 500000

  vertex_batch:
    enabled: true
    gcs_bucket: "consortium-batch-staging"
    poll_interval_s: 30
    poll_timeout_s: 3600
