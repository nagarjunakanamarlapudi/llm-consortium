model:
  id: "vertex-llama4-maverick"
  provider: "google_vertex_openai"
  api_model: "meta/llama-4-maverick-17b-128e-instruct-maas"

  pricing:
    input: 0.09
    output: 0.36
    batch_discount: 0.50
    cached_input: 0.00

  parameters:
    temperature: 0.7
    max_tokens: 16384
    top_p: 1.0

  context_window: 128000
  supports_batch: true
  supports_caching: false

  batching:
    enabled: true
    window_ms: 50000
    max_batch_size: 100

  rate_limits:
    requests_per_minute: 1000
    tokens_per_minute: 500000

  vertex_batch:
    enabled: true
    gcs_bucket: "consortium-batch-staging2"
    batch_location: "us-east5"
    poll_interval_s: 30
    poll_timeout_s: 36000
