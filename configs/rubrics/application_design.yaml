rubric:
  id: "application_design"
  name: "Application Design Evaluation Rubric"
  description: "Rubric for evaluating application-level software design quality."

  dimensions:
    - id: "domain_model"
      name: "Domain Model Quality"
      weight: 1.4
      description: "Quality of entity modeling, relationships, and domain logic encapsulation."
      anchors:
        "1": "No domain model; logic scattered without structure."
        "2": "Basic entities identified but poor boundaries and coupling."
        "3": "Reasonable entity model with defined relationships; some boundary issues."
        "4": "Well-structured domain model with clear aggregates, value objects, and invariants."
        "5": "Rich domain model with bounded contexts, event-driven integration, and ubiquitous language."

    - id: "module_structure"
      name: "Module Structure & Dependencies"
      weight: 1.2
      description: "Organization of code into cohesive, loosely-coupled modules."
      anchors:
        "1": "Monolithic blob; no meaningful structure."
        "2": "Some separation but high coupling and low cohesion."
        "3": "Identifiable modules with reasonable separation of concerns."
        "4": "Well-defined module boundaries with explicit dependencies and clear layering."
        "5": "Sophisticated module architecture with plugin systems, dependency inversion, and clean boundaries."

    - id: "testability"
      name: "Testability"
      weight: 1.2
      description: "How easy the design is to test at unit, integration, and end-to-end levels."
      anchors:
        "1": "Untestable design; tight coupling to external systems."
        "2": "Difficult to test; requires extensive mocking."
        "3": "Reasonably testable with standard dependency injection."
        "4": "Highly testable with clear boundaries, ports/adapters, and test strategy."
        "5": "Test-first design with contract testing, property-based testing, and test infrastructure."

    - id: "error_handling"
      name: "Error Handling"
      weight: 1.0
      description: "Error propagation, user feedback, recovery strategies, and edge cases."
      anchors:
        "1": "No error handling; crashes on unexpected input."
        "2": "Generic catch-all handling; poor user feedback."
        "3": "Typed errors for common cases; reasonable user messages."
        "4": "Comprehensive error hierarchy with recovery strategies and user-friendly feedback."
        "5": "Sophisticated error handling with retry policies, circuit breakers, graceful degradation, and telemetry."

    - id: "interface_design"
      name: "Interface & Contract Design"
      weight: 1.0
      description: "Quality of public APIs, contracts, and abstraction boundaries."
      anchors:
        "1": "No clear interfaces; implementation details exposed."
        "2": "Basic interfaces but leaky abstractions."
        "3": "Defined interfaces with reasonable abstraction; some inconsistency."
        "4": "Clean interfaces with consistent patterns, versioning, and documentation."
        "5": "Exemplary interface design with backward compatibility, discoverability, and developer ergonomics."

    - id: "cross_cutting_concerns"
      name: "Cross-Cutting Concerns"
      weight: 0.6
      description: "Handling of concerns that span multiple modules: logging, configuration, authentication, caching."
      anchors:
        "1": "No cross-cutting strategy; concerns handled ad-hoc in every module."
        "2": "Some shared utilities but inconsistent usage and scattered configuration."
        "3": "Identified cross-cutting concerns with basic middleware or decorator patterns."
        "4": "Well-structured cross-cutting layer with AOP, middleware pipelines, and consistent configuration management."
        "5": "Elegant cross-cutting architecture with composable middleware, centralized policy enforcement, and zero-boilerplate integration."

    - id: "state_management"
      name: "State Management"
      weight: 0.6
      description: "How application state is organized, mutated, and synchronized across components."
      anchors:
        "1": "No state management strategy; global mutable state everywhere."
        "2": "Basic state handling but unclear ownership and uncontrolled mutations."
        "3": "Defined state boundaries with reasonable encapsulation; some shared mutable state."
        "4": "Clear state ownership with immutable patterns, event-driven updates, and predictable state transitions."
        "5": "Sophisticated state architecture with CQRS, event sourcing, or state machines; full auditability and replay capability."

    - id: "concurrency_safety"
      name: "Concurrency Safety"
      weight: 0.6
      description: "How the design handles concurrent access, race conditions, and thread safety."
      anchors:
        "1": "No concurrency consideration; race conditions inevitable."
        "2": "Acknowledges concurrency but relies on coarse-grained locks or hope."
        "3": "Basic thread safety with standard synchronization; some potential for deadlocks."
        "4": "Well-designed concurrency with fine-grained locking, lock-free structures, or actor models; deadlock prevention."
        "5": "Provably safe concurrency design with formal reasoning about ordering, linearizability, and progress guarantees."

    - id: "security_design"
      name: "Security Design"
      weight: 0.6
      description: "Authentication, authorization, input validation, and data protection."
      anchors:
        "1": "No security measures."
        "2": "Basic authentication but no authorization or input validation."
        "3": "Standard auth/authz with input validation for primary paths."
        "4": "Comprehensive security with RBAC, CSRF protection, and secure data handling."
        "5": "Defense-in-depth with security headers, CSP, audit logging, and vulnerability scanning."

    - id: "trade_off_awareness"
      name: "Trade-off Awareness"
      weight: 0.6
      description: "Explicit discussion of design trade-offs and alternatives considered."
      anchors:
        "1": "No trade-offs discussed."
        "2": "Mentions trade-offs without analysis."
        "3": "Identifies key trade-offs with rationale."
        "4": "Explicit analysis of alternatives with justified decisions."
        "5": "Deep reasoning about trade-offs with reversibility assessment and migration paths."

    - id: "requirement_coverage"
      name: "Requirement Coverage"
      weight: 0.8
      description: "How thoroughly the design addresses all stated requirements."
      anchors:
        "1": "Ignores most requirements."
        "2": "Addresses some requirements; major gaps."
        "3": "Covers core requirements; minor gaps."
        "4": "Addresses all stated requirements with reasonable completeness."
        "5": "Comprehensive coverage with proactive identification of implicit needs."

    - id: "extensibility"
      name: "Extensibility"
      weight: 0.4
      description: "How easily the design accommodates new features and changing requirements."
      anchors:
        "1": "Rigid design; changes require rewrites."
        "2": "Some extension points but high modification cost."
        "3": "Reasonable extensibility for anticipated changes."
        "4": "Well-designed extension points with plugin architecture and feature toggles."
        "5": "Highly extensible with event-driven architecture, strategy patterns, and configuration-driven behavior."
