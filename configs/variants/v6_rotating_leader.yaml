variant:
  id: v6
  name: Rotating Leader
  description: "Multiple participants take turns as the lead designer across rounds, with other participants reviewing. This distributes authority and brings diverse perspectives to each iteration."
  matrix_position:
    authority: decentralized
    roles: specialized
    dynamics: cooperative
  sub_variant: null
  agents:
    participants:
      - id: participant_1
        role: designer
        model: vertex-gemini-2.5-pro
        system_prompt_template: generation/design_system.j2
        application_prompt_template: generation/design_application.j2
        parameters:
          temperature: 0.7
          max_tokens: 16384
          top_p: 1.0
      - id: participant_2
        role: designer
        model: gpt-oss-120b
        system_prompt_template: generation/design_system.j2
        application_prompt_template: generation/design_application.j2
        parameters:
          temperature: 0.7
          max_tokens: 16384
          top_p: 1.0
      - id: participant_3
        role: designer
        model: vertex-gemini-2.5-pro
        system_prompt_template: generation/design_system.j2
        application_prompt_template: generation/design_application.j2
        parameters:
          temperature: 0.7
          max_tokens: 16384
          top_p: 1.0

  workflow:
    max_rounds: 3
    rotation_order:
      - participant_1
      - participant_2
      - participant_3
    review_template: review/general_review.j2
  token_budget:
    estimated_input: 100000
    estimated_output: 60000
