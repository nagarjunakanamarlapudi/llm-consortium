variant:
  id: v8
  name: Structured Debate
  description: "Multiple debaters argue for competing design approaches through structured rounds of position statements and rebuttals, then a judge synthesizes the strongest arguments into a final solution."
  matrix_position:
    authority: decentralized
    roles: homogeneous
    dynamics: adversarial
  sub_variant: null
  agents:
    debaters:
      - id: debater_1
        role: debater
        model: vertex-gemini-2.5-pro
        perspective: "performance-first"
        system_prompt_template: debate/position_assignment.j2
        application_prompt_template: debate/position_assignment.j2
        parameters:
          temperature: 0.8
          max_tokens: 16384
          top_p: 1.0
      - id: debater_2
        role: debater
        model: vertex-gemini-2.5-pro
        perspective: "simplicity-first"
        system_prompt_template: debate/position_assignment.j2
        application_prompt_template: debate/position_assignment.j2
        parameters:
          temperature: 0.8
          max_tokens: 16384
          top_p: 1.0
      - id: debater_3
        role: debater
        model: vertex-gemini-2.5-pro
        perspective: "resilience-first"
        system_prompt_template: debate/position_assignment.j2
        application_prompt_template: debate/position_assignment.j2
        parameters:
          temperature: 0.8
          max_tokens: 16384
          top_p: 1.0
    judge:
      role: judge
      model: vertex-gpt-oss-120b
      system_prompt_template: debate/judge_ruling.j2
      parameters:
        temperature: 0.3
        max_tokens: 16384
        top_p: 1.0
  workflow:
    max_rounds: 3
    rebuttal_template: debate/rebuttal.j2
    synthesis_template: synthesis/merge_dialectical.j2
  token_budget:
    estimated_input: 140000
    estimated_output: 85000
