[project]
name = "llm-consortium"
version = "0.1.0"
description = "Multi-LLM consortium experiment framework for software design generation and evaluation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.43",
    "openai>=1.60",
    "google-genai>=1.5",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer[all]>=0.15",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "duckdb>=1.2",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.24",
    "tenacity>=9.0",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "krippendorff>=0.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "respx>=0.22",
]
local = [
    "ollama>=0.4",
]
dashboard = [
    "streamlit>=1.41",
]

[project.scripts]
consortium = "consortium.cli.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/consortium"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
